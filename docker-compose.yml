version: '3.8'

services:
  # Main ARIA Server
  aria:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aria-server
    ports:
      - "${ARIA_PORT:-8000}:8000"
    environment:
      - ARIA_HOST=0.0.0.0
      - ARIA_PORT=8000
      - ARIA_LOG_LEVEL=${ARIA_LOG_LEVEL:-info}
      - ARIA_EXECUTION_MODE=${ARIA_EXECUTION_MODE:-dynamic_layers}
      - ARIA_WORKERS=${ARIA_WORKERS:-4}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
      - ./models_cache:/app/models_cache
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - aria-network
    depends_on:
      - redis  # Optional: for distributed caching

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: aria-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - aria-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: aria-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - aria-network
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: aria-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=aria-grafana-pass
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - aria-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: aria-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - aria-network
    depends_on:
      - aria
    profiles:
      - production

# Named volumes for persistence
volumes:
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# Network for service communication
networks:
  aria-network:
    driver: bridge

